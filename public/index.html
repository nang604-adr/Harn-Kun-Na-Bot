<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>หารกันนะ — หารค่าใช้จ่ายทริป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- LINE LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- QR Code generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Realtime sync -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root{
    --green:#06C755;
    --green-dark:#04a847;
    --green-soft:#e8f9ef;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1d2b25;
    --muted:#7a8a83;
    --line:#e7ecea;
    --red:#e5484d;
    --red-soft:#fdecec;
    --blue:#2f6feb;
    --amber:#f0a500;
    --radius:16px;
    --shadow:0 2px 10px rgba(20,40,30,.06);
    --shadow-lg:0 8px 28px rgba(20,40,30,.14);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}

  /* Header */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--green);
    color:#fff;
    padding:14px 16px;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .topbar .back{
    background:rgba(255,255,255,.18);border:none;color:#fff;
    width:34px;height:34px;border-radius:10px;font-size:18px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  }
  .topbar .title{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .sub{font-size:12px;opacity:.85;font-weight:400;}
  .topbar .icon-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  /* content */
  .content{flex:1;padding:16px;padding-bottom:120px;}

  /* tabs */
  .tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:16px;position:sticky;top:64px;z-index:20;}
  .tab{flex:1;text-align:center;padding:10px 4px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border:none;background:none;transition:.15s;}
  .tab.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(6,199,85,.35);}

  /* cards */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  .section-title{font-size:13px;color:var(--muted);font-weight:600;margin:18px 2px 8px;text-transform:none;}

  /* trip cards */
  .trip-card{display:flex;align-items:center;gap:14px;cursor:pointer;}
  .trip-emoji{width:48px;height:48px;border-radius:14px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
  .trip-info{flex:1;min-width:0;}
  .trip-name{font-weight:700;font-size:16px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trip-meta{font-size:12.5px;color:var(--muted);}
  .chev{color:var(--muted);font-size:20px;}

  /* expense row */
  .exp{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .exp:last-child{border-bottom:none;}
  .exp-ico{width:42px;height:42px;border-radius:12px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
  .exp-ico.photo{overflow:hidden;background:var(--line);padding:0;cursor:zoom-in;}
  .exp-ico.photo img{width:100%;height:100%;object-fit:cover;}
  .clip{font-size:12px;opacity:.65;}
  /* photo upload in form */
  .photo-up{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;background:var(--bg);cursor:pointer;}
  .photo-up .pu-ico{font-size:24px;}
  .photo-up .pu-txt{font-weight:600;color:var(--green-dark);font-size:14px;}
  .photo-up .pu-sub{font-size:12px;color:var(--muted);}
  .photo-prev{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .photo-prev img{width:100%;display:block;max-height:280px;object-fit:contain;background:#000;}
  .photo-prev .pp-actions{display:flex;gap:8px;padding:10px;background:var(--card);}
  .photo-prev .pp-actions .btn{flex:1;}
  .img-viewer{width:100%;border-radius:14px;display:block;background:#000;max-height:78vh;object-fit:contain;}
  /* ตารางรายละเอียดแบบ Excel */
  .xtable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);}
  .xtable{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;}
  .xtable th,.xtable td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  .xtable th:last-child,.xtable td:last-child{border-right:none;}
  .xtable thead th{background:var(--green-soft);color:var(--green-dark);font-weight:700;}
  .xtable th.lbl,.xtable td.lbl{text-align:left;position:sticky;left:0;background:var(--card);min-width:130px;border-right:1px solid var(--line);}
  .xtable thead th.lbl{background:var(--green-soft);z-index:3;}
  .xtable td.payer-cell{background:rgba(6,199,85,.12);font-weight:700;color:var(--green-dark);}
  .xtable tbody tr:nth-child(even) td{background:#fafcfb;}
  .xtable tbody tr:nth-child(even) td.lbl{background:#fafcfb;}
  .xtable tbody tr:nth-child(even) td.payer-cell{background:rgba(6,199,85,.14);}
  .xtable tfoot td{font-weight:700;background:var(--bg);border-top:2px solid var(--green);}
  .xtable tfoot td.lbl{background:var(--bg);}
  .xtable .muted{color:var(--muted);font-weight:400;}
  .xtable .pos{color:var(--green-dark);} .xtable .neg{color:var(--red);}
  .xtable .desc-main{font-weight:600;}
  .xtable .desc-sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;}
  .exp-body{flex:1;min-width:0;}
  .exp-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .exp-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .exp-amt{font-weight:700;font-size:15px;text-align:right;white-space:nowrap;}
  .exp-amt small{display:block;font-weight:400;font-size:11px;color:var(--muted);}

  /* member chip */
  .members-wrap{display:flex;flex-wrap:wrap;gap:8px;}
  .mchip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 6px;font-size:14px;font-weight:500;}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto;}
  .mchip .del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;}

  /* summary */
  .bal-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .bal-row:last-child{border-bottom:none;}
  .bal-name{flex:1;font-weight:600;}
  .bal-sub{font-size:11.5px;color:var(--muted);font-weight:400;}
  .bal-amt{font-weight:700;white-space:nowrap;}
  .pos{color:var(--green-dark);}
  .neg{color:var(--red);}
  .zero{color:var(--muted);}

  .settle{padding:13px;background:var(--bg);border-radius:12px;margin-bottom:10px;border:1.5px solid transparent;}
  .settle-main{display:flex;align-items:center;gap:10px;}
  .settle .who{font-weight:600;}
  .settle .arrow{color:var(--green);font-size:18px;}
  .settle .amt{margin-left:auto;font-weight:700;color:var(--text);white-space:nowrap;}
  .settle-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
  .settle-actions .btn{flex:1;min-width:92px;}
  .settle.paid{background:var(--green-soft);border-color:rgba(6,199,85,.35);}
  .settle.paid .amt{color:var(--green-dark);}
  .paid-badge{display:inline-block;background:var(--green);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;}
  .warn-line{font-size:11.5px;color:var(--amber);margin-top:7px;font-weight:600;}

  .total-banner{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-lg);}
  .total-banner .lbl{font-size:13px;opacity:.9;}
  .total-banner .val{font-size:30px;font-weight:700;margin-top:2px;}
  .total-banner .meta{font-size:12.5px;opacity:.9;margin-top:6px;}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:13px;padding:13px 18px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;width:100%;}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(6,199,85,.3);}
  .btn-primary:active{transform:scale(.98);}
  .btn-light{background:var(--green-soft);color:var(--green-dark);}
  .btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--line);}
  .btn-outline{background:#fff;color:var(--green-dark);border:1.5px solid var(--green);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-sm{padding:9px 14px;font-size:13.5px;width:auto;border-radius:11px;}

  /* FAB */
  .fab{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);max-width:528px;width:calc(100% - 32px);z-index:25;}

  /* empty */
  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .em{font-size:54px;margin-bottom:12px;}
  .empty .et{font-weight:600;color:var(--text);margin-bottom:4px;}
  .empty .es{font-size:13px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,30,22,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;animation:fade .2s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;animation:slideup .25s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + var(--safe-bottom));}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-head{position:sticky;top:0;background:var(--card);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:2;}
  .sheet-head h3{margin:0;font-size:17px;font-weight:700;}
  .sheet-head .x{background:var(--bg);border:none;width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--muted);}
  .sheet-body{padding:16px 18px;}
  .grab{width:40px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 0;}

  /* form */
  label.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 6px;}
  label.fl:first-child{margin-top:0;}
  .inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:.15s;}
  .inp:focus{border-color:var(--green);background:#fff;}
  textarea.inp{resize:none;min-height:48px;}
  .amount-inp{font-size:26px;font-weight:700;text-align:center;letter-spacing:.5px;}

  /* payer / split selectors */
  .picker{display:flex;flex-wrap:wrap;gap:8px;}
  .pick{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.12s;font-family:inherit;color:var(--text);}
  .pick.sel{border-color:var(--green);background:var(--green-soft);color:var(--green-dark);}
  .pick .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;}
  .pick.sel .check{color:var(--green);}

  .split-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;}
  .split-head .fl{margin:0;}
  .link-btn{background:none;border:none;color:var(--green-dark);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}

  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .seg{display:flex;gap:8px;margin-top:6px;}
  .seg .pick{flex:1;justify-content:center;}

  .row-2{display:flex;gap:10px;}
  .row-2 .btn{flex:1;}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222d28;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:99;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg);}
  .toast.show{opacity:1;bottom:100px;}

  .badge{display:inline-block;background:var(--green-soft);color:var(--green-dark);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;}

  .split-summary-line{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}
  .settled-note{text-align:center;padding:28px 12px;color:var(--green-dark);font-weight:600;}
  .settled-note .big{font-size:40px;margin-bottom:8px;}
  hr.div{border:none;border-top:1px solid var(--line);margin:16px 0;}
  .cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .cat{aspect-ratio:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cat.sel{border-color:var(--green);background:var(--green-soft);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="content" id="content"></div>
</div>
<button class="btn btn-primary fab" id="fab" style="display:none"></button>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   หารกันนะ — LINE LIFF เว็บแอปหารค่าใช้จ่ายทริป
   ========================================================= */

/* ---------- ตั้งค่า LIFF ----------
   ใส่ LIFF ID ของคุณตรงนี้ (จาก LINE Developers Console)
   แอปจะทำงานได้แม้เปิดในเบราว์เซอร์ปกติ (โหมดทดสอบ) ด้วย */
const LIFF_ID = "2009937945-DrzlxH49"; // LIFF ID ของแอป หารกันนะ

/* ---------- ค่าคงที่ ---------- */
const AVATAR_COLORS = ["#06C755","#2f6feb","#f0a500","#e5484d","#8b5cf6","#0ea5e9","#ec4899","#14b8a6","#f97316","#6366f1"];
const CATS = ["🍜","🏨","🚗","⛽","🎟️","🛒","☕","🍻","🎁","🏖️","✈️","💸"];
const STORE_KEY = "harn_kan_na_v1";

/* ---------- สถานะ ---------- */
let state = { trips: [], currentTripId: null, roundMode: 'baht' };
let liffReady = false, liffProfile = null;

/* ---------- เรียลไทม์ (WebSocket) ---------- */
let space = null;          // พื้นที่ข้อมูลร่วม (= กลุ่มไลน์)
let socket = null;
let joined = false;
const outbox = [];         // op ที่ส่งไม่ทัน (ออฟไลน์) รอส่งตอนต่อสำเร็จ

/* ---------- ตัวช่วย ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => {
  const v = Math.round(n*100)/100;
  return v.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2});
};
function initials(name){
  const t = name.trim();
  return t ? t.slice(0,2).toUpperCase() : "?";
}
function colorFor(id){
  let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) & 0xffffff;
  return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];
}
function avatar(member, cls=""){
  if(!member) return "";
  return `<span class="avatar ${cls}" style="background:${colorFor(member.id)}">${esc(initials(member.name))}</span>`;
}
/* ---------- แคชในเครื่อง (โหลดไว + กันออฟไลน์) ---------- */
function cacheSave(){
  try{
    if(!space) return;
    localStorage.setItem('hkn:'+space, JSON.stringify({trips:state.trips, roundMode:state.roundMode}));
    localStorage.setItem('hkn_cur:'+space, state.currentTripId||'');
  }catch(e){}
}
function cacheLoad(){
  try{
    if(!space) return;
    const d=localStorage.getItem('hkn:'+space);
    if(d){ const o=JSON.parse(d); state.trips=o.trips||[]; state.roundMode=o.roundMode||'baht'; }
    const c=localStorage.getItem('hkn_cur:'+space); if(c) state.currentTripId=c;
  }catch(e){}
}
function save(){ cacheSave(); return true; }   // โค้ดเก่าบางจุดยังเรียก save() อยู่
function load(){ cacheLoad(); }

/* ---------- นำ op มาปรับ state.trips (ตรงกับฝั่งเซิร์ฟเวอร์) ---------- */
function applyOpTo(d, op){
  d.trips = d.trips || [];
  const T = id => d.trips.find(t=>t.id===id);
  switch(op.type){
    case 'createTrip': if(op.trip && !T(op.trip.id)) d.trips.push(op.trip); break;
    case 'updateTrip': { const t=T(op.tripId); if(t&&op.fields) Object.assign(t,op.fields); break; }
    case 'deleteTrip': d.trips=d.trips.filter(t=>t.id!==op.tripId); break;
    case 'addMember': { const t=T(op.tripId); if(t){ t.members=t.members||[]; if(!t.members.find(m=>m.id===op.member.id)) t.members.push(op.member);} break; }
    case 'updateMember': { const t=T(op.tripId); if(t){ const m=(t.members||[]).find(x=>x.id===op.member.id); if(m) Object.assign(m,op.member);} break; }
    case 'removeMember': { const t=T(op.tripId); if(t){ t.members=(t.members||[]).filter(m=>m.id!==op.memberId); const first=t.members[0]; (t.expenses||[]).forEach(e=>{ e.splitIds=(e.splitIds||[]).filter(x=>x!==op.memberId); if(e.payerId===op.memberId&&first) e.payerId=first.id; }); } break; }
    case 'addExpense': { const t=T(op.tripId); if(t){ t.expenses=t.expenses||[]; if(!t.expenses.find(e=>e.id===op.expense.id)) t.expenses.push(op.expense);} break; }
    case 'updateExpense': { const t=T(op.tripId); if(t){ const e=(t.expenses||[]).find(x=>x.id===op.expense.id); if(e) Object.assign(e,op.expense);} break; }
    case 'deleteExpense': { const t=T(op.tripId); if(t) t.expenses=(t.expenses||[]).filter(e=>e.id!==op.expenseId); break; }
    case 'setSettle': { const t=T(op.tripId); if(t){ t.settle=t.settle||{}; t.settle[op.key]=op.rec; } break; }
    case 'setRoundMode': d.roundMode=op.mode; break;
  }
  return d;
}
function sendOp(op){ if(socket && joined && socket.connected) socket.emit('op', op); else outbox.push(op); }
/* แอ็กชันมาตรฐาน: ปรับ state -> ส่ง op -> แคช -> วาดใหม่ */
function mutate(op){ applyOpTo(state, op); sendOp(op); cacheSave(); render(); }

/* ---------- ตั้งค่า WebSocket ---------- */
function setupSocket(){
  if(typeof io === 'undefined') return;   // โหลด socket.io ไม่ได้ -> ใช้แคชอย่างเดียว
  socket = io({ transports:['websocket','polling'] });
  socket.on('connect', ()=>{ joined=false; socket.emit('join', { space }); });
  socket.on('state', ({data})=>{
    state.trips = (data && data.trips) || [];
    if(data && data.roundMode) state.roundMode = data.roundMode;
    joined = true;
    if(outbox.length){ for(const op of outbox){ applyOpTo(state, op); socket.emit('op', op); } outbox.length=0; }
    cacheSave(); render();
  });
  socket.on('op', (op)=>{ applyOpTo(state, op); cacheSave(); render(); });
}

/* ---------- หา space (พื้นที่ข้อมูลร่วม) ---------- */
function resolveSpace(){
  const p = new URLSearchParams(location.search);
  let sp = p.get('space');
  if(!sp){ const ls=p.get('liff.state'); if(ls){ try{ sp=new URLSearchParams(ls.replace(/^\?/,'')).get('space'); }catch(e){} } }
  if(sp) return sp;
  if(liffReady && typeof liff!=='undefined'){
    try{ const ctx=liff.getContext(); if(ctx){ if(ctx.groupId) return 'group:'+ctx.groupId; if(ctx.roomId) return 'room:'+ctx.roomId; if(ctx.userId) return 'user:'+ctx.userId; } }catch(e){}
  }
  return 'demo';   // เปิดในเบราว์เซอร์ปกติ (ทดสอบ)
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2000);
}
function trip(){ return state.trips.find(t=>t.id===state.currentTripId) || null; }
function memberById(tp,id){ return tp.members.find(m=>m.id===id); }

/* =========================================================
   LOGIC การคำนวณ
   ========================================================= */

/* แบ่งยอดเป็นสตางค์แบบไม่ให้เศษหาย: คืน array สตางค์ตามจำนวนคน */
function splitCents(totalCents, n){
  const base = Math.floor(totalCents / n);
  let rem = totalCents - base*n;
  const out = [];
  for(let i=0;i<n;i++){ out.push(base + (i<rem?1:0)); }
  return out;
}

/* ---------- สกุลเงิน ---------- */
const CUR_SYMBOL = {THB:'฿',JPY:'¥',USD:'$',EUR:'€',GBP:'£',KRW:'₩',CNY:'¥',SGD:'S$',TWD:'NT$',HKD:'HK$',MYR:'RM',VND:'₫',LAK:'₭',AUD:'A$'};
function curSym(code){ return CUR_SYMBOL[code] || ((code&&code!=='THB')? code+' ':'฿'); }
function curDecimals(code){ return (code==='JPY'||code==='KRW'||code==='VND'||code==='LAK'||code==='TWD')?0:2; }
function fmtCur(amount, code){
  const d=curDecimals(code);
  const v = d===0 ? Math.round(amount) : Math.round(amount*100)/100;
  return v.toLocaleString('th-TH',{minimumFractionDigits:d, maximumFractionDigits:d});
}
function expCur(e){ return e.cur || 'THB'; }
function expTHB(e){ return (Number(e.amount)||0) * (e.rate || 1); }   // ยอดเป็นบาท (เรทล็อกไว้ตอนบันทึก)

/* คำนวณยอดของแต่ละคน (เป็นบาทเสมอ):
   paid = จ่ายออกไปทั้งหมด, owed = ส่วนที่ต้องรับผิดชอบ, net = paid - owed */
function computeBalances(tp){
  const bal = {};
  tp.members.forEach(m => bal[m.id] = { paid:0, owed:0, net:0 });
  let totalCents = 0;
  for(const e of tp.expenses){
    const cents = Math.round(expTHB(e)*100);     // แปลงเป็นบาทก่อนคำนวณ
    totalCents += cents;
    // ผู้จ่าย
    if(bal[e.payerId]) bal[e.payerId].paid += cents;
    // คนที่หาร (กรองเฉพาะที่ยังเป็นสมาชิกอยู่)
    const sp = (e.splitIds||[]).filter(id=>bal[id]);
    if(sp.length===0) continue;
    const parts = splitCents(cents, sp.length);
    sp.forEach((id,i)=> bal[id].owed += parts[i]);
  }
  // แปลงกลับเป็นบาท
  Object.values(bal).forEach(b=>{
    b.paid/=100; b.owed/=100; b.net = b.paid - b.owed;
  });
  return { bal, total: totalCents/100 };
}

/* ส่วนที่แต่ละคนต้องหารของรายการเดียว (คืน map id->บาท, ตรงกับ computeBalances) */
function expShares(tp, e){
  const map={};
  const sp=(e.splitIds||[]).filter(id=>memberById(tp,id));
  if(sp.length){
    const parts=splitCents(Math.round(expTHB(e)*100), sp.length);
    sp.forEach((id,i)=> map[id]=parts[i]/100);
  }
  return map;
}

/* สรุปการโอน แบบลดจำนวนครั้งให้น้อยที่สุด (greedy จับเจ้าหนี้-ลูกหนี้ก้อนใหญ่สุด) */
function settle(bal){
  const EPS = 0.005;
  const creditors=[], debtors=[];
  for(const id in bal){
    const net = Math.round(bal[id].net*100)/100;
    if(net > EPS) creditors.push({id, amt:net});
    else if(net < -EPS) debtors.push({id, amt:-net});
  }
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const res=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    res.push({ from:debtors[i].id, to:creditors[j].id, amount:Math.round(pay*100)/100 });
    debtors[i].amt -= pay; creditors[j].amt -= pay;
    if(debtors[i].amt < EPS) i++;
    if(creditors[j].amt < EPS) j++;
  }
  return res;
}

/* ปัดยอดสุทธิเป็นจำนวนเต็มบาท แบบเกลี่ยให้ผลรวมเป็นศูนย์ (sum-zero) */
function roundNetsToBaht(balNets){
  const ids=Object.keys(balNets);
  const exact=ids.map(id=>balNets[id]);
  let rounded=exact.map(v=>Math.round(v));
  let diff=rounded.reduce((a,b)=>a+b,0);          // ควรเป็น 0
  const residual=ids.map((_,i)=>rounded[i]-exact[i]);
  const order=ids.map((_,i)=>i);
  if(diff>0){ order.sort((a,b)=>residual[b]-residual[a]); for(let k=0;k<diff&&k<order.length;k++) rounded[order[k]]-=1; }
  else if(diff<0){ order.sort((a,b)=>residual[a]-residual[b]); for(let k=0;k<(-diff)&&k<order.length;k++) rounded[order[k]]+=1; }
  const out={}; ids.forEach((id,i)=>out[id]=rounded[i]); return out;
}
/* คืนยอดที่ใช้แสดง/โอน ตามโหมดปัดเศษ (baht=บาทเต็ม, satang=มีสตางค์)
   - bal: ใช้กับการ์ดยอดแต่ละคน + การโอน
   - exact: ยอดจริง (มีสตางค์) ใช้กับตารางละเอียด */
function effectiveBalances(tp){
  const { bal, total } = computeBalances(tp);
  const mode = state.roundMode || 'baht';
  if(mode !== 'baht') return { bal, total, mode, exact: bal };
  const nets={}; for(const id in bal) nets[id]=bal[id].net;
  const rnet = roundNetsToBaht(nets);
  const bal2={};
  for(const id in bal){
    const net = rnet[id];
    bal2[id] = { paid: bal[id].paid, net: net, owed: bal[id].paid - net };
  }
  return { bal: bal2, total, mode, exact: bal };
}
function setRoundMode(m){ mutate({type:'setRoundMode', mode:m}); }

/* ---------- PromptPay QR (มาตรฐาน EMVCo) ---------- */
function ppCrc16(str){
  let crc=0xFFFF;
  for(let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){ crc = (crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function ppTlv(id,val){ return id + String(val.length).padStart(2,'0') + val; }
function ppTarget(raw){
  const id=String(raw||'').replace(/[^0-9]/g,'');
  if(id.length>=15) return {type:'03', val:id};                                   // e-wallet
  if(id.length>=13) return {type:'02', val:id};                                   // เลขบัตรประชาชน
  return {type:'01', val:('0000000000000'+id.replace(/^0/,'66')).slice(-13)};     // เบอร์มือถือ
}
/* คืน payload string ของ PromptPay QR (raw=เบอร์/เลขบัตร, amount=ยอดบาท) */
function promptpayPayload(raw, amount){
  const t=ppTarget(raw);
  const merchant = ppTlv('00','A000000677010111') + ppTlv(t.type,t.val);
  let p='';
  p += ppTlv('00','01');
  p += ppTlv('01', amount ? '12':'11');
  p += ppTlv('29', merchant);
  p += ppTlv('53','764');
  if(amount) p += ppTlv('54', Number(amount).toFixed(2));
  p += ppTlv('58','TH');
  p += '6304';
  p += ppCrc16(p);
  return p;
}
function validPromptpay(raw){
  const id=String(raw||'').replace(/[^0-9]/g,'');
  return id.length===10 || id.length===13 || id.length===15;
}

function renderExpensesTab(tp){
  if(tp.expenses.length===0){
    return `<div class="empty"><div class="em">🧾</div><div class="et">ยังไม่มีค่าใช้จ่าย</div><div class="es">กดปุ่มด้านล่างเพื่อบันทึกค่าใช้จ่ายแรก</div></div>`;
  }
  const {total} = computeBalances(tp);
  let html = `<div class="total-banner"><div class="lbl">ใช้จ่ายไปทั้งหมด</div><div class="val">฿${fmt(total)}</div><div class="meta">${tp.expenses.length} รายการ · เฉลี่ย ฿${fmt(total/Math.max(tp.members.length,1))}/คน</div></div>`;
  // เรียงใหม่ล่าสุดอยู่บน
  const exps = [...tp.expenses].reverse();
  html += `<div class="card">`;
  for(const e of exps){
    const payer = memberById(tp,e.payerId);
    const sp = (e.splitIds||[]).filter(id=>memberById(tp,id));
    const who = sp.length===tp.members.length ? "หารทุกคน" : sp.map(id=>memberById(tp,id)?.name).filter(Boolean).join(", ");
    const ico = e.photo
      ? `<div class="exp-ico photo" onclick="event.stopPropagation();viewPhoto('${e.id}')" title="ดูใบเสร็จ"><img src="${e.photo}" alt="ใบเสร็จ"></div>`
      : `<div class="exp-ico">${e.emoji||'🧾'}</div>`;
    html += `<div class="exp" onclick="openExpenseForm('${e.id}')">
      ${ico}
      <div class="exp-body">
        <div class="exp-title">${esc(e.desc||'ค่าใช้จ่าย')}${e.photo?' <span class="clip">📎</span>':''}</div>
        <div class="exp-sub">${payer?esc(payer.name):'?'} จ่าย · หาร ${sp.length} คน (${esc(who)})</div>
      </div>
      <div class="exp-amt">${(function(){
        const cur=expCur(e);
        if(cur==='THB') return `฿${fmt(e.amount)}<small>${e.date?fmtDate(e.date):''}</small>`;
        return `${curSym(cur)}${fmtCur(e.amount,cur)}<small>≈ ฿${fmt(expTHB(e))}${e.date?' · '+fmtDate(e.date):''}</small>`;
      })()}</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

  if(tp.members.length===0){

function renderSummaryTab(tp){
  const { bal, total, mode, exact } = effectiveBalances(tp);
  if(total===0){
    return `<div class="empty"><div class="em">📊</div><div class="et">ยังไม่มีข้อมูลสรุป</div><div class="es">เพิ่มค่าใช้จ่ายก่อน แล้วกลับมาดูสรุปยอด</div></div>`;
  }
  let html = `<div class="total-banner"><div class="lbl">ยอดรวมทั้งทริป</div><div class="val">฿${fmt(total)}</div><div class="meta">${tp.members.length} คน · ${tp.expenses.length} รายการ</div></div>`;

  // สลับโหมดปัดเศษ
  html += `<div class="seg" style="margin-bottom:14px">
    <button class="pick ${mode==='baht'?'sel':''}" onclick="setRoundMode('baht')">ปัดเป็นบาทเต็ม</button>
    <button class="pick ${mode==='satang'?'sel':''}" onclick="setRoundMode('satang')">แบบมีสตางค์</button>
  </div>`;

  // ยอดแต่ละคน
  html += `<div class="section-title">ยอดของแต่ละคน</div><div class="card">`;
  for(const m of tp.members){
    const b = bal[m.id]; const net = Math.round(b.net*100)/100;
    const cls = net>0.005?'pos':(net<-0.005?'neg':'zero');
    const txt = net>0.005?`ควรได้คืน ฿${fmt(net)}`:(net<-0.005?`ต้องจ่ายเพิ่ม ฿${fmt(-net)}`:'ลงตัวพอดี');
    html += `<div class="bal-row">
      ${avatar(m)}
      <div class="bal-name">${esc(m.name)}<div class="bal-sub">จ่ายจริง ฿${fmt(b.paid)} · ส่วนที่ต้องจ่าย ฿${fmt(b.owed)}</div></div>
      <div class="bal-amt ${cls}">${txt}</div>
    </div>`;
  }
  html += `</div>`;
  if(mode==='baht') html += `<div class="hint" style="padding:0 4px 6px">ปัดยอดโอนเป็นจำนวนเต็มบาทเพื่อความสะดวก (เกลี่ยให้ยอดรวมตรงพอดี) · ดูยอดละเอียดมีสตางค์ได้ในตารางด้านล่าง</div>`;

  // ตารางรายละเอียดแบบ Excel (ใครจ่าย / หารใคร)
  html += `<div class="section-title">ตารางรายละเอียด (เช็คทีละรายการ)</div>`;
  html += `<div class="xtable-wrap"><table class="xtable"><thead><tr><th class="lbl">รายการ</th><th>ยอด</th>`;
  for(const m of tp.members) html += `<th>${esc(m.name)}</th>`;
  html += `</tr></thead><tbody>`;
  for(const e of tp.expenses){
    const shares = expShares(tp,e);
    const payer = memberById(tp,e.payerId);
    const curNote = expCur(e)!=='THB' ? ` · ${curSym(expCur(e))}${fmtCur(e.amount,expCur(e))}` : '';
    html += `<tr><td class="lbl"><div class="desc-main">${e.emoji||'🧾'} ${esc(e.desc||'ค่าใช้จ่าย')}</div><div class="desc-sub">จ่ายโดย ${payer?esc(payer.name):'?'}${e.date?' · '+fmtDate(e.date):''}${curNote}</div></td>`;
    html += `<td>฿${fmt(expTHB(e))}</td>`;
    for(const m of tp.members){
      const isPayer = e.payerId===m.id;
      const sh = shares[m.id];
      const cls = isPayer?'payer-cell':'';

      else html += `<td class="${cls} muted">${isPayer?'💳':'–'}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody><tfoot>`;
  html += `<tr><td class="lbl">รวมที่ต้องหาร</td><td>฿${fmt(total)}</td>`;
  for(const m of tp.members) html += `<td>฿${fmt(exact[m.id].owed)}</td>`;
  html += `</tr>`;
  html += `<tr><td class="lbl">จ่ายจริง</td><td class="muted">–</td>`;
  for(const m of tp.members) html += `<td>฿${fmt(exact[m.id].paid)}</td>`;
  html += `</tr>`;
  html += `<tr><td class="lbl">สุทธิ</td><td class="muted">–</td>`;
  for(const m of tp.members){ const net=Math.round(exact[m.id].net*100)/100; const c=net>0.005?'pos':(net<-0.005?'neg':'muted'); html += `<td class="${c}">${net>0.005?'+':''}${fmt(net)}</td>`; }
  html += `</tr></tfoot></table></div>`;
  html += `<div class="hint" style="padding:6px 4px">ตารางนี้เป็น<strong>ยอดจริงละเอียด (มีสตางค์)</strong> ไว้เช็คทีละรายการ · 💳 = คนที่ออกเงินรายการนั้น · เลื่อนซ้าย–ขวาเพื่อดูครบทุกคน</div>`;

  // การโอน
  const tx = settle(bal);
  const st = tp.settle || {};
  const paidCount = tx.filter(t=> st[t.from+'->'+t.to] && st[t.from+'->'+t.to].paid).length;
  html += `<div class="section-title">ใครต้องโอนให้ใคร <span class="badge">โอนน้อยครั้งที่สุด</span></div>`;
  if(tx.length===0){
    html += `<div class="card settled-note"><div class="big">🎉</div>ทุกคนเคลียร์กันเรียบร้อย<br>ไม่มีใครต้องโอนเพิ่ม</div>`;
  }else{
    if(paidCount===tx.length){
      html += `<div class="card settled-note" style="padding:18px"><div class="big">✅</div>โอนครบทุกรายการแล้ว (${paidCount}/${tx.length})</div>`;
    }
    html += `<div class="card">`;
    tx.forEach((t)=>{
      const from = memberById(tp,t.from), to = memberById(tp,t.to);
      const rec = st[t.from+'->'+t.to] || {};
      const isPaid = !!rec.paid;
      const hasSlip = !!rec.slip;
      const amtChanged = isPaid && rec.amount!=null && Math.round(rec.amount*100)!==Math.round(t.amount*100);
      let actions='';
      if(!isPaid){
        actions += to && to.promptpay
          ? `<button class="btn btn-light btn-sm" onclick="showQR('${to.id}',${t.amount})">📲 QR โอน</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="openMemberForm('${to?.id}')">＋ ใส่ PromptPay</button>`;
      }
      actions += hasSlip
        ? `<button class="btn btn-ghost btn-sm" onclick="viewSlip('${t.from}','${t.to}')">🧾 ดูสลิป</button>`
        : `<button class="btn btn-ghost btn-sm" onclick="attachSlip('${t.from}','${t.to}',${t.amount})">📎 แนบสลิป</button>`;
      actions += isPaid
        ? `<button class="btn btn-ghost btn-sm" onclick="togglePaid('${t.from}','${t.to}',${t.amount})">↩︎ ยกเลิก</button>`
        : `<button class="btn btn-outline btn-sm" onclick="togglePaid('${t.from}','${t.to}',${t.amount})">○ กดเมื่อจ่ายแล้ว</button>`;
      html += `<div class="settle ${isPaid?'paid':''}">
        <div class="settle-main">
          ${avatar(from)}
          <span class="who">${esc(from?.name||'?')}</span>
          <span class="arrow">→</span>
          ${avatar(to)}
          <span class="who">${esc(to?.name||'?')}</span>
          <span class="amt">฿${fmt(t.amount)}${isPaid?'<span class="paid-badge">✓ จ่ายแล้ว</span>':''}</span>
        </div>
        ${amtChanged?`<div class="warn-line">⚠️ ยอดเปลี่ยนหลังทำเครื่องหมาย (ตอนนั้น ฿${fmt(rec.amount)}) — ตรวจสอบอีกครั้ง</div>`:''}
        <div class="settle-actions">${actions}</div>
      </div>`;
    });
    html += `</div><div class="hint" style="padding:0 4px">เคลียร์แล้ว ${paidCount}/${tx.length} รายการ · กด "จ่ายแล้ว" หรือ "แนบสลิป" เมื่อโอนเสร็จ · กดปุ่มด้านล่างเพื่อส่งสรุปเข้ากลุ่ม LINE</div>`;
  }
  // ปุ่มพรีวิว/บันทึก PDF (เล็ก ๆ ไว้ล่างสุด)
  html += `<div style="text-align:center;margin-top:16px"><button class="btn btn-ghost btn-sm" style="width:auto" onclick="exportPDF()">📄 พรีวิว / บันทึก PDF</button></div>`;
  return html;
}

function fmtDate(iso){
  try{
    const d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  }catch(e){ return ""; }
}

function readFx(){
  const cur = ($("#f_fxcur")?.value||'').trim().toUpperCase().replace(/[^A-Z]/g,'');
  const rate = parseFloat($("#f_fxrate")?.value);
  if(cur && cur!=='THB' && rate>0) return { cur, rate };
  return null;
}
function saveTrip(id){
  const name = $("#f_tripname").value.trim();
  if(!name){ toast("กรุณาใส่ชื่อทริป"); return; }
  const emojiEl = $("#f_tripemoji .sel");
  const emoji = emojiEl?emojiEl.dataset.e:'🧳';
  const fx = readFx();
  if(id){
    closeSheet();
    mutate({type:'updateTrip', tripId:id, fields:{name, emoji, fx}});
    toast("บันทึกการแก้ไขแล้ว");
    return;
  }
  const rawNames = $("#f_members").value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  const members = rawNames.map(nm=>({id:uid(),name:nm}));
  const t = { id:uid(), name, emoji, members, expenses:[], createdAt:new Date().toISOString() };
  if(fx) t.fx = fx;
  state.currentTripId=t.id; view="trip"; tab=members.length?"exp":"members";
  closeSheet();
  mutate({type:'createTrip', trip:t});

function deleteTrip(id){

  if(state.currentTripId===id){ state.currentTripId=null; view="trips"; }
  closeSheet();
  mutate({type:'deleteTrip', tripId:id});
  toast("ลบทริปแล้ว");
}

/* ----- แสดง QR PromptPay สำหรับการโอน ----- */
function showQR(memberId, amount){
  const tp=trip();
  const m=memberById(tp,memberId);
  if(!m || !m.promptpay){ openMemberForm(memberId); return; }
  const payload=promptpayPayload(m.promptpay, amount);
  openSheet('สแกนเพื่อโอนให้ '+m.name, `
    <div style="text-align:center">
      <div style="font-size:13px;color:var(--muted)">โอนให้</div>
      <div style="font-weight:700;font-size:18px;margin:2px 0">${avatar(m)} ${esc(m.name)}</div>
      <div style="font-size:30px;font-weight:700;color:var(--green-dark);margin:6px 0">฿${fmt(amount)}</div>
      <div id="qrbox" style="display:inline-block;background:#fff;padding:14px;border-radius:16px;box-shadow:var(--shadow);margin:8px 0"></div>
      <div style="font-size:12px;color:var(--muted)">PromptPay: ${esc(m.promptpay)}</div>
      <div class="hint" style="margin-top:10px">เปิดแอปธนาคาร เลือก "สแกน" แล้วสแกน QR นี้ · ยอดเงินถูกระบุไว้ให้แล้ว</div>
    </div>
  `);
  // วาด QR
  setTimeout(()=>{
    const box=$("#qrbox"); if(!box) return;
    box.innerHTML="";
    if(typeof QRCode!=="undefined"){
      new QRCode(box, { text:payload, width:220, height:220, correctLevel:QRCode.CorrectLevel.M });
    }else{
      box.innerHTML='<div style="padding:20px;color:var(--muted);font-size:13px">โหลด QR ไม่สำเร็จ<br>ต้องต่ออินเทอร์เน็ต</div>';
    }
  }, 60);
}
/* ----- สถานะการโอน: จ่ายแล้ว / แนบสลิป ----- */
function settleRec(tp, from, to){
  tp.settle = tp.settle || {};
  const key = from+'->'+to;
  tp.settle[key] = tp.settle[key] || {};
  return tp.settle[key];
}
function togglePaid(from, to, amount){
  const tp=trip();
  const key=from+'->'+to;
  const cur=(tp.settle&&tp.settle[key])||{};
  const rec=Object.assign({}, cur);
  rec.paid=!cur.paid;
  if(rec.paid) rec.amount=amount;
  mutate({type:'setSettle', tripId:tp.id, key, rec});
  toast(rec.paid?"ทำเครื่องหมายว่าจ่ายแล้ว ✓":"ยกเลิกสถานะจ่ายแล้ว");
}
function attachSlip(from, to, amount){
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange=async ev=>{
    const file=ev.target.files && ev.target.files[0];
    if(!file) return;
    if(!/^image\//.test(file.type)){ toast("เลือกไฟล์รูปภาพเท่านั้น"); return; }
    toast("กำลังประมวลผลสลิป...");
    try{
      const data=await resizeImage(file, 1200, 0.7);
      const tp=trip();
      const key=from+'->'+to;
      const cur=(tp.settle&&tp.settle[key])||{};
      const rec=Object.assign({}, cur, {slip:data, paid:true, amount});
      mutate({type:'setSettle', tripId:tp.id, key, rec});
      toast("แนบสลิปและทำเครื่องหมายจ่ายแล้ว ✓");
    }catch(e){ toast("อ่านรูปไม่สำเร็จ ลองใหม่อีกครั้ง"); }
  };
  input.click();
}
function viewSlip(from, to){
  const tp=trip();
  const rec=(tp.settle||{})[from+'->'+to];
  if(!rec || !rec.slip) return;
  openSheet('สลิปการโอน', `
    <img class="img-viewer" src="${rec.slip}" alt="สลิป">
    <button class="btn btn-danger" style="margin-top:12px" onclick="removeSlip('${from}','${to}')">🗑️ ลบสลิปนี้</button>
  `);
}
function removeSlip(from, to){
  const tp=trip();
  const key=from+'->'+to;
  const cur=(tp.settle&&tp.settle[key])||{};
  const rec=Object.assign({}, cur, {slip:null});
  closeSheet();
  mutate({type:'setSettle', tripId:tp.id, key, rec});
  toast("ลบสลิปแล้ว");
}
function removeMember(id){
  const tp = trip();
  const used = tp.expenses.some(e=>e.payerId===id);
  if(used){
    if(!confirm("สมาชิกนี้เป็นผู้จ่ายในบางรายการ หากลบ ระบบจะย้ายผู้จ่ายเป็นคนแรกของทริป และถอดชื่อออกจากการหาร ต้องการลบหรือไม่?")) return;
  }
  mutate({type:'removeMember', tripId:tp.id, memberId:id});
  toast("ลบสมาชิกแล้ว");

/* ย่อ+บีบอัดรูปก่อนเก็บ เพื่อประหยัดพื้นที่ */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else   { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject; img.src=ev.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
async function onPhotoPick(ev){
  const file=ev.target.files && ev.target.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("เลือกไฟล์รูปภาพเท่านั้น"); return; }
  toast("กำลังประมวลผลรูป...");

}

  el.style.color="var(--muted)";

function buildSummaryText(){
  const tp=trip();
  const {bal,total}=effectiveBalances(tp);
  const tx=settle(bal);
  let s=`📋 สรุปทริป: ${tp.name}\n`;
  s+=`💰 ยอดรวม ฿${fmt(total)} · ${tp.members.length} คน · ${tp.expenses.length} รายการ\n`;
  s+=`\n👤 ยอดของแต่ละคน\n`;
  for(const m of tp.members){
    const b=bal[m.id]; const net=Math.round(b.net*100)/100;
    const tag = net>0.005?`ได้คืน ฿${fmt(net)}`:(net<-0.005?`จ่ายเพิ่ม ฿${fmt(-net)}`:'ลงตัว');
    s+=`• ${m.name}: จ่าย ฿${fmt(b.paid)} (${tag})\n`;
  }
  s+=`\n🔁 การโอน (น้อยครั้งที่สุด)\n`;
  if(tx.length===0) s+=`ทุกคนเคลียร์กันเรียบร้อย 🎉\n`;
  else{
    const st=tp.settle||{};
    for(const t of tx){
      const rec=st[t.from+'->'+t.to];
      const mark = rec&&rec.paid ? ' ✅ จ่ายแล้ว' : '';
      s+=`• ${memberById(tp,t.from)?.name} → ${memberById(tp,t.to)?.name}: ฿${fmt(t.amount)}${mark}\n`;
    }
    const paidCount=tx.filter(t=>st[t.from+'->'+t.to]&&st[t.from+'->'+t.to].paid).length;
    s+=`(เคลียร์แล้ว ${paidCount}/${tx.length} รายการ)\n`;
  }
  s+=`\n— ส่งจากแอป หารกันนะ 🧮`;
  return s;
}
async function shareSummary(){
  const tp=trip();
  if(tp.expenses.length===0){ toast("ยังไม่มีค่าใช้จ่ายให้สรุป"); return; }
  const text=buildSummaryText();
  // 1) ถ้าเปิดจากกลุ่ม -> ให้บอทโพสต์สรุปเข้ากลุ่มนั้นเลย
  if(space && (space.startsWith('group:') || space.startsWith('room:'))){
    toast("กำลังส่งสรุปเข้ากลุ่ม...");
    try{
      const r = await fetch('/api/share', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({space, text})});
      if(r.ok){ toast("ส่งสรุปเข้ากลุ่มแล้ว ✅"); return; }
    }catch(e){ /* fallback ด้านล่าง */ }
  }
  // 2) Web Share API (เลือกแชร์เอง)
  if(navigator.share){
    try{ await navigator.share({text}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  // 3) คัดลอกข้อความ
  try{
    await navigator.clipboard.writeText(text);
    showTextSheet(text, true);
  }catch(e){
    showTextSheet(text, false);
  }
}
function showTextSheet(text, copied){
  openSheet('สรุปสำหรับส่งเข้ากลุ่ม', `
    ${copied?'<div class="hint" style="color:var(--green-dark);font-weight:600;margin-bottom:8px">✅ คัดลอกข้อความแล้ว วางในกลุ่ม LINE ได้เลย</div>':'<div class="hint" style="margin-bottom:8px">คัดลอกข้อความด้านล่างไปวางในกลุ่ม LINE</div>'}
    <textarea class="inp" style="min-height:280px;font-size:13px" readonly onclick="this.select()">${esc(text)}</textarea>
    <button class="btn btn-primary" style="margin-top:12px" onclick="copyAgain()">📋 คัดลอกอีกครั้ง</button>
  `);
  window._shareText=text;
}
async function copyAgain(){
  try{ await navigator.clipboard.writeText(window._shareText); toast("คัดลอกแล้ว ✅"); }catch(e){ toast("กดค้างที่ข้อความเพื่อคัดลอก"); }
}

async function exportPDF(){
  const tp=trip();
  if(!tp || tp.expenses.length===0){ toast("ยังไม่มีข้อมูลให้บันทึก"); return; }
  if(typeof html2canvas==="undefined" || !(window.jspdf && window.jspdf.jsPDF)){ toast("โหลดเครื่องมือ PDF ไม่สำเร็จ ต้องต่ออินเทอร์เน็ต"); return; }
  toast("กำลังสร้าง PDF...");
  const node=buildPrintable(tp);
  document.body.appendChild(node);
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    const canvas=await html2canvas(node, {scale:2, backgroundColor:'#ffffff', useCORS:true, windowWidth:node.scrollWidth});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pageW=pdf.internal.pageSize.getWidth();
    const pageH=pdf.internal.pageSize.getHeight();
    const margin=10;
    const imgW=pageW-margin*2;
    const usable=pageH-margin*2;
    const cw=canvas.width;
    const pxPerMm = cw/imgW;                          // canvas px ต่อ มม.
    const pageCanvasH = Math.floor(usable*pxPerMm);   // ความสูงสูงสุดต่อหน้า (canvas px)
    // จุดตัด = ขอบล่างของแต่ละแถว (กันตัดกลางแถว -> ไม่ล้นขอบ)
    const nodeTop = node.getBoundingClientRect().top;
    const ratio = canvas.height / node.scrollHeight;
    const cuts=[];
    node.querySelectorAll('tr').forEach(el=>{
      const b=(el.getBoundingClientRect().bottom - nodeTop)*ratio;
      if(b>0 && b<canvas.height) cuts.push(b);
    });
    cuts.push(canvas.height); cuts.sort((a,b)=>a-b);
    let start=0;
    while(start < canvas.height-1){
      let target=start+pageCanvasH, cut=-1;
      if(target>=canvas.height){ cut=canvas.height; }
      else { for(const b of cuts){ if(b>start+10 && b<=target) cut=b; } if(cut<0) cut=target; }
      const hPx=Math.max(1, Math.round(cut-start));
      const tmp=document.createElement('canvas'); tmp.width=cw; tmp.height=hPx;
      const ctx=tmp.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,hPx);
      ctx.drawImage(canvas, 0, start, cw, hPx, 0, 0, cw, hPx);
      if(start>0) pdf.addPage();
      pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG', margin, margin, imgW, hPx/pxPerMm);
      start=cut;
    }
    const fname=`สรุป-${(tp.name||'ทริป').replace(/[\\/:*?"<>|]/g,'')}.pdf`;
    const blob = pdf.output('blob');
    // 1) เมนูแชร์ของระบบ (ดีสุดบนมือถือ — เซฟลง Files / ส่งต่อได้)
    try{
      const file = new File([blob], fname, { type:'application/pdf' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title: fname });
        toast("เปิดเมนูบันทึก/แชร์ PDF แล้ว");
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; /* ผู้ใช้กดยกเลิกเอง */ }
    // 2) เปิดพรีวิวในแท็บใหม่ (เดสก์ท็อป)
    try{
      const blobUrl = URL.createObjectURL(blob);
      const w = window.open(blobUrl, '_blank');
      if(w){ toast("เปิดพรีวิว PDF แล้ว"); return; }
    }catch(e){}
    // 3) ดาวน์โหลดตรง (สำรองสุดท้าย)
    try{ pdf.save(fname); toast("บันทึก PDF แล้ว ✅"); }catch(_){ toast("สร้าง PDF ไม่สำเร็จ — ลองเปิดในเบราว์เซอร์ Safari/Chrome"); }
  }catch(err){
    toast("สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง");
  }finally{
    node.remove();
  }
}

      try{ liffProfile = await liff.getProfile(); }catch(e){}
    }
  }catch(e){ /* ทำงานต่อในโหมดเบราว์เซอร์ปกติ */ }
}

(async function start(){
  await initLiff();
  space = resolveSpace();            // หาพื้นที่ข้อมูลร่วม (กลุ่มไลน์)
  load();                            // โหลดแคชของ space นี้ (ขึ้นไว)
  // ถ้าเคยอยู่ในทริปไหน ให้กลับเข้าหน้านั้น
  if(state.currentTripId && state.trips.find(t=>t.id===state.currentTripId)){
    view="trip"; tab="exp";
  }
  render();
  setupSocket();                     // เชื่อมเรียลไทม์ -> รับข้อมูลล่าสุดมาทับ + ซิงค์ต่อเนื่อง
})();
</script>
